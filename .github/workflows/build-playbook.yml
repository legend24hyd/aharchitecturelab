name: Build System Design Interview Playbook

on:
  push:
    paths:
      - "System-Design-Interview-Playbook/**"
      - ".github/workflows/build-playbook.yml"
  pull_request:
    paths:
      - "System-Design-Interview-Playbook/**"
      - ".github/workflows/build-playbook.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System-Design-Interview-Playbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc and PyYAML
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install -r tools/requirements.txt
      - name: Lint manuscript map and chapter headings
        run: python3 tools/build.py lint
      - name: HTML preview
        run: python3 tools/build.py html
      - name: EPUB
        run: python3 tools/build.py epub
      - name: DOCX
        run: python3 tools/build.py docx
      - uses: actions/upload-artifact@v4
        with:
          name: system-design-interview-playbook-epub
          path: System-Design-Interview-Playbook/output/epub/system-design-interview-playbook.epub
