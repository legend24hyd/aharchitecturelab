<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title">
  <title id="title">Playbook high-level design template</title>
  <rect width="920" height="300" fill="#ffffff"/>
  <rect x="24" y="36" width="200" height="72" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="124" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Clients</text>
  <text x="124" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">Web / Mobile / Partners</text>
  <rect x="268" y="36" width="240" height="72" rx="10" fill="#fff2cc" stroke="#d6b656"/>
  <text x="388" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Edge</text>
  <text x="388" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">DNS / CDN / LB / WAF</text>
  <rect x="552" y="36" width="200" height="72" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text x="652" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Application</text>
  <text x="652" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">Stateless services</text>
  <rect x="268" y="176" width="240" height="80" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="388" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Data</text>
  <text x="388" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">Store / Cache / Search</text>
  <rect x="552" y="176" width="200" height="80" rx="10" fill="#f8cecc" stroke="#b85450"/>
  <text x="652" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Async</text>
  <text x="652" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">Queue / workers</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>
  <line x1="224" y1="72" x2="268" y2="72" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="508" y1="72" x2="552" y2="72" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="632" y1="108" x2="500" y2="176" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="108" x2="652" y2="176" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>
