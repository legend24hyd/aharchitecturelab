<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">URL shortener high-level design</title>
  <rect width="960" height="420" fill="#ffffff"/>
  <rect x="24" y="170" width="110" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="79" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">User</text>
  <rect x="184" y="170" width="130" height="56" rx="10" fill="#fff2cc" stroke="#d6b656"/>
  <text x="249" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Load balancer</text>
  <rect x="364" y="48" width="160" height="64" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text x="444" y="74" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Link API</text>
  <text x="444" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">create short URL</text>
  <rect x="364" y="166" width="160" height="64" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text x="444" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Redirect service</text>
  <rect x="584" y="88" width="150" height="64" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="659" y="114" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Cache</text>
  <text x="659" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">code to URL</text>
  <rect x="584" y="188" width="150" height="56" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="659" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Mapping store</text>
  <rect x="364" y="300" width="160" height="56" rx="10" fill="#f8cecc" stroke="#b85450"/>
  <text x="444" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Click events</text>
  <rect x="584" y="300" width="150" height="56" rx="10" fill="#f8cecc" stroke="#b85450"/>
  <text x="659" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14">Analytics</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>
  <line x1="134" y1="198" x2="184" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="249" y1="170" x2="364" y2="96" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="314" y1="198" x2="364" y2="198" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="524" y1="198" x2="584" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="524" y1="210" x2="584" y2="216" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="524" y1="80" x2="584" y2="216" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="444" y1="230" x2="444" y2="300" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="524" y1="328" x2="584" y2="328" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="300" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">POST /v1/links</text>
  <text x="318" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">GET /s/{code}</text>
